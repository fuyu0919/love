# /etc/nginx/sites-available/yujianxiaoquan.online
# 证书用 certbot 签发后，把下面两处域名保持一致
# 站点由 Node（systemd）监听 127.0.0.1:4321，Nginx 只做反向代理

server {
    listen 80;
    listen [::]:80;
    server_name yujianxiaoquan.online www.yujianxiaoquan.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yujianxiaoquan.online www.yujianxiaoquan.online;

    ssl_certificate     /etc/letsencrypt/live/yujianxiaoquan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yujianxiaoquan.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 带 hash 的静态资源长缓存，其余由 Astro 自行处理
    location /_astro/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
