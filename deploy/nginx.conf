# /etc/nginx/sites-available/yujianxiaoquan.online
# 用前替换证书路径中的域名（与 server_name 一致）

server {
    listen 80;
    listen [::]:80;
    server_name yujianxiaoquan.online www.yujianxiaoquan.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yujianxiaoquan.online www.yujianxiaoquan.online;

    ssl_certificate     /etc/letsencrypt/live/yujianxiaoquan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yujianxiaoquan.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root  /var/www/yujianxiaoquan.online;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Astro 带 hash 的静态资源，长缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 图片，中等缓存
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 目录式 URL：/blog/xxx/ -> /blog/xxx/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
